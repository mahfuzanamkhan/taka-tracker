<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taka Tracker · টাকা ট্র্যাকার</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Theme tokens (light / dark / auto) ---------- */
:root{--bg:#f4f2eb;--cd:#fff;--ink:#12231b;--mu:#68786f;--ln:#e3e0d6;--g:#006a4e;--r:#f42a41;--pos:#0a8f66;--neg:#d6293e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0b1410;--cd:#13211a;--ink:#e8f2ec;--mu:#8ca498;--ln:#223329;--g:#2fd29a;--pos:#3ee0a8;--neg:#ff6b7c;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1410;--cd:#13211a;--ink:#e8f2ec;--mu:#8ca498;--ln:#223329;--g:#2fd29a;--pos:#3ee0a8;--neg:#ff6b7c;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 'Hind Siliguri',system-ui,sans-serif;padding-bottom:130px}
#app,header{max-width:720px;margin:auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding-top:18px;padding-bottom:6px}
.logo{display:flex;gap:10px;align-items:center;font:700 18px 'Space Grotesk',sans-serif}
.logo i{width:34px;height:34px;border-radius:11px;background:var(--g);color:#fff;display:grid;place-items:center;font-style:normal;position:relative}
.logo i:after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--r);border:2px solid var(--bg)}
.mn{display:flex;align-items:center;gap:4px;font-weight:600}
.mn button{background:var(--cd);border:1px solid var(--ln);color:var(--ink);width:32px;height:32px;border-radius:10px;font-size:16px;cursor:pointer}
.mn span{min-width:112px;text-align:center}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:16px;margin:12px 0}
h3{font-size:14px;color:var(--mu);font-weight:600;margin-bottom:10px;letter-spacing:.02em}
small{color:var(--mu);display:block;font-size:12.5px}
/* Hero: deep green with a red sun, a quiet nod to the flag */
.hero{background:radial-gradient(circle at 88% 22%,#f42a41 0 46px,transparent 47px),linear-gradient(135deg,#00513b,#006a4e 60%,#0a8f66);color:#fff;border:0;position:relative;overflow:hidden}
.hero small{color:#bfe9da}
.big{font:700 38px 'Space Grotesk',sans-serif;letter-spacing:-.02em;margin:2px 0 12px}
.chips{display:flex;gap:8px}
.chips div{flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:9px 12px;backdrop-filter:blur(6px)}
.chips b{font:700 17px 'Space Grotesk',sans-serif;display:block}
.eye{position:absolute;right:14px;bottom:14px;background:none;border:0;font-size:18px;cursor:pointer;opacity:.85}
.wl{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.wl div{min-width:104px;background:var(--bg);border-radius:14px;padding:9px 11px}
.wl b{font:700 15px 'Space Grotesk',sans-serif;display:block}
.two{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center}
.dn{width:130px}.dt{font-size:7px;fill:var(--mu)}.dv{font:700 10px 'Space Grotesk';fill:var(--ink)}
.lg{display:grid;gap:5px;font-size:13px}.lg div{display:flex;gap:7px;align-items:center}
.lg i{width:9px;height:9px;border-radius:3px;flex:none}.lg span{margin-left:auto;color:var(--mu)}
.bars{width:100%;height:70px}
.ins{display:grid;gap:8px}.ins p{background:var(--bg);border-radius:12px;padding:9px 12px;font-size:14px}
.row,.rw{display:flex;gap:11px;align-items:center}
.row{padding:10px 4px;cursor:pointer;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.row>div{flex:1;min-width:0}.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ic{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-style:normal;font-size:18px;flex:none}
.row span,.sp{font:700 15px 'Space Grotesk',sans-serif;margin-left:auto;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.dh{font-size:12.5px;font-weight:700;color:var(--mu);margin:16px 4px 2px}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;font:inherit;margin:4px 0 8px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);outline-offset:0}
label{display:block;font-size:12.5px;color:var(--mu);font-weight:600}
.bar{height:8px;border-radius:9px;background:var(--bg);overflow:hidden;margin:8px 0 4px}
.bar u{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .5s}
.bar.warn u{background:#f4a261}.bar.over u{background:var(--r)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.seg button,.btn{flex:1;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:600 14px inherit;cursor:pointer}
.seg button.on,.btn.p{background:var(--g);color:#fff;border-color:var(--g)}
.dng{color:var(--neg)}
.zr{font:700 22px 'Space Grotesk',sans-serif;margin-top:6px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--cd);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:100px;background:none;border:0;color:var(--mu);font:600 11px inherit;cursor:pointer;padding:5px 0;display:grid;gap:1px;justify-items:center}
nav button b{font-size:19px;font-weight:400}nav button.on{color:var(--g)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:19px;border:0;background:var(--r);color:#fff;font-size:30px;box-shadow:0 8px 24px rgba(244,42,65,.4);cursor:pointer;z-index:6}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheet{background:var(--cd);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h2{font:700 20px 'Space Grotesk',sans-serif;margin-bottom:8px}
.empty{text-align:center;padding:34px 10px;color:var(--mu)}.empty h2{color:var(--ink);font-size:20px;margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style></head><body>
<header><div class="logo"><i>৳</i><span id="brand"></span></div><div class="mn" id="mn"></div></header>
<main id="app"></main>
<button class="fab" data-a="add" aria-label="Add">+</button>
<nav id="nav"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<script>
/* =====================================================================
   Taka Tracker — zero-dependency expense app built for Bangladesh.
   State lives in one object (S), persisted to localStorage, rendered
   with plain template strings. Click handling is delegated via data-a.
   ===================================================================== */
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,0)}-${String(d.getDate()).padStart(2,0)}`};

/* ---------- Domain data: categories, income sources, wallets ---------- */
// [icon, English, Bangla, chart colour]
const CAT={bazar:['🛒','Bazar (groceries)','বাজার','#e76f51'],food:['🍛','Food & tea','খাবার ও চা','#f4a261'],trans:['🚌','Transport','যাতায়াত','#2a9d8f'],rent:['🏠','House rent','বাসাভাড়া','#6d597a'],bill:['💡','Gas, power, water','গ্যাস-বিদ্যুৎ-পানি','#e9c46a'],net:['📱','Mobile & internet','মোবাইল ও নেট','#4cc9f0'],edu:['🎓','Education','শিক্ষা','#8338ec'],med:['💊','Health','চিকিৎসা','#ef476f'],fam:['👪','Family & remittance','পরিবার','#06d6a0'],zakat:['🤲','Zakat & charity','যাকাত-দান','#118ab2'],shop:['🛍️','Shopping','কেনাকাটা','#ff7096'],fun:['🎬','Fun & outings','বিনোদন','#b5838d'],other:['📦','Other','অন্যান্য','#8d99ae']};
const INC={salary:['💼','Salary','বেতন'],biz:['🏪','Business','ব্যবসা'],free:['💻','Freelance','ফ্রিল্যান্স'],remit:['✈️','Remittance','রেমিট্যান্স'],gift:['🎁','Gift / Eid salami','উপহার / সালামি'],oth:['➕','Other income','অন্য আয়']};
const WAL={cash:['💵','Cash','ক্যাশ'],bkash:['📲','bKash','বিকাশ'],nagad:['📲','Nagad','নগদ'],rocket:['🚀','Rocket','রকেট'],bank:['🏦','Bank','ব্যাংক'],card:['💳','Card','কার্ড']};

/* ---------- Bilingual dictionary: key -> [English, Bangla] ---------- */
const I={ov:['Home','হোম'],tx:['Ledger','লেনদেন'],bg:['Budget','বাজেট'],dh:['Dhar','ধার'],gl:['Goals','লক্ষ্য'],tl:['Tools','টুলস'],
bal:['Total balance across wallets','সব ওয়ালেটের মোট ব্যালেন্স'],inc:['Income','আয়'],exp:['Spent','খরচ'],by:['Where your taka went','টাকা কোথায় গেল'],daily:['Daily spending','দৈনিক খরচ'],ins:['Sharp insights','তথ্যচিত্র'],
topc:['Biggest drain','সবচেয়ে বেশি খরচ'],davg:['Daily average','দৈনিক গড়'],proj:['On pace for','মাস শেষে হতে পারে'],srate:['Savings rate','সঞ্চয়ের হার'],over:['Over by','সীমা ছাড়িয়েছে'],left:['left','বাকি'],recent:['Latest','সাম্প্রতিক'],
none:['Your wallet’s story starts here.','আপনার টাকার গল্প শুরু হোক এখান থেকে।'],noneS:['Add your first entry, or try demo data.','প্রথম হিসাব যোগ করুন, অথবা ডেমো ডেটা দেখুন।'],
demo:['Load demo data','ডেমো ডেটা'],add:['New entry','নতুন হিসাব'],save:['Save','সংরক্ষণ'],del:['Delete','মুছুন'],sure:['Tap again to confirm','নিশ্চিত করতে আবার চাপুন'],
amt:['Amount (৳)','টাকার পরিমাণ'],cat:['Category','ক্যাটাগরি'],wal:['Wallet','ওয়ালেট'],date:['Date','তারিখ'],note:['Note','নোট'],search:['Search notes…','নোট খুঁজুন…'],all:['All','সব'],
lent:['Owed to me (Pawna)','পাওনা'],borr:['I owe (Dena)','দেনা'],who:['Person','কার সাথে'],paid:['Settled so far (৳)','এ পর্যন্ত শোধ'],due:['Due date','ফেরতের তারিখ'],
target:['Target (৳)','লক্ষ্য (৳)'],saved:['Saved so far (৳)','জমানো (৳)'],name:['Name','নাম'],tb:['Monthly spending cap','মাসিক খরচের সীমা'],set:['Set limit','সীমা ঠিক করুন'],
zk:['Zakat calculator','যাকাত ক্যালকুলেটর'],zc:['Cash, bank & wallets (৳)','নগদ, ব্যাংক ও ওয়ালেট (৳)'],zg:['Gold, silver & investments (৳)','সোনা, রূপা ও বিনিয়োগ (৳)'],zl:['Debts you must repay (৳)','পরিশোধযোগ্য দেনা (৳)'],zn:['Nisab today: 52.5 tola silver (৳)','আজকের নিসাব: ৫২.৫ তোলা রূপা (৳)'],
zr:['Zakat due (2.5%)','যাকাত প্রদেয় (২.৫%)'],zno:['Enter today’s nisab to see your zakat.','যাকাত দেখতে আজকের নিসাব লিখুন।'],zlow:['Below nisab — no zakat due.','নিসাবের নিচে — যাকাত ফরজ নয়।'],
pref:['Preferences','পছন্দ'],data:['Backup & restore','ব্যাকআপ ও রিস্টোর'],reset:['Erase everything','সব মুছুন'],restore:['Restore from text','টেক্সট থেকে রিস্টোর'],
income:['Income','আয়'],expense:['Expense','খরচ'],tagline:['Every taka, accounted for.','প্রতিটি টাকার হিসাব।'],goalq:['Add','যোগ']};
const t=k=>I[k]?I[k][S.lang=='bn'?1:0]:k, B=()=>S.lang=='bn', nm=o=>o[B()?2:1];
const cat=k=>CAT[k]||INC[k]||CAT.other;

/* ---------- State & persistence ---------- */
const KEY='taka-tracker-bd-v1';
let S=Object.assign({tx:[],bud:{},debt:[],goal:[],lang:'en',theme:'auto',hide:0},(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}})());
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
let tab='ov',ym=today().slice(0,7),ed=null,F={q:'',type:'',w:''};

/* ---------- Formatting: Bangladeshi lakh/crore grouping, optional Bangla digits ---------- */
const num=n=>new Intl.NumberFormat(B()?'bn-BD':'en-IN',{maximumFractionDigits:0}).format(n);
const fmt=n=>S.hide?'৳ ••••':(n<0?'−':'')+'৳'+num(Math.abs(Math.round(n)));
const pc=x=>num(Math.round(x*100))+'%';
const dstr=(d,o)=>new Date(d+'T00:00').toLocaleDateString(B()?'bn-BD':'en-GB',o);

/* ---------- Derived data ---------- */
const mt=()=>S.tx.filter(x=>x.date.startsWith(ym));
const sum=(a,ty)=>a.filter(x=>x.type==ty).reduce((s,x)=>s+x.amt,0);
const byCat=a=>Object.entries(a.filter(x=>x.type=='e').reduce((o,x)=>(o[x.cat]=(o[x.cat]||0)+x.amt,o),{})).sort((a,b)=>b[1]-a[1]);
const wal=()=>{const o=Object.fromEntries(Object.keys(WAL).map(k=>[k,0]));S.tx.forEach(x=>o[x.w]+=x.type=='i'?x.amt:-x.amt);return o};
const prog=(v,lim)=>{if(!lim)return'';const p=v/lim;return `<div class="bar ${p>1?'over':p>.8?'warn':''}"><u style="width:${Math.min(p,1)*100}%"></u></div><small>${p>1?t('over')+' '+fmt(v-lim):fmt(lim-v)+' '+t('left')}</small>`};

/* ---------- Charts (hand-rolled SVG) ---------- */
const donut=(by,tot)=>{let a=0;const C=2*Math.PI*40;return `<svg viewBox="0 0 100 100" class="dn">${by.map(([k,v])=>{const l=v/tot*C,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${CAT[k]?CAT[k][3]:'#999'}" stroke-width="14" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-a}" transform="rotate(-90 50 50)"/>`;a+=l;return s}).join('')}<text x="50" y="47" text-anchor="middle" class="dt">${t('exp').toUpperCase()}</text><text x="50" y="60" text-anchor="middle" class="dv">${S.hide?'••••':num(tot)}</text></svg>`};
const bars=(m,dim)=>{const d=Array(dim).fill(0);m.filter(x=>x.type=='e').forEach(x=>d[+x.date.slice(8)-1]+=x.amt);const mx=Math.max(...d,1),w=300/dim;return `<svg viewBox="0 0 300 70" class="bars">${d.map((v,i)=>`<rect x="${i*w+.6}" y="${64-v/mx*60}" width="${w-1.2}" height="${Math.max(v/mx*60,v?2:.8)}" rx="1.5" fill="${v?'var(--g)':'var(--ln)'}"/>`).join('')}</svg>`};

/* ---------- Views ---------- */
const row=x=>{const c=cat(x.cat);return `<div class="row" data-a="edit" data-v="${x.id}"><i class="ic">${c[0]}</i><div><b>${esc(x.note)||nm(c)}</b><small>${nm(c)} · ${nm(WAL[x.w])}</small></div><span class="${x.type=='i'?'pos':'neg'}">${x.type=='i'?'+':'−'}${fmt(x.amt)}</span></div>`};
const emptyState=()=>`<div class="card empty"><h2>${t('none')}</h2><p>${t('noneS')}</p><br><button class="btn p" data-a="demo">✨ ${t('demo')}</button></div>`;
const views={
ov(){
  const m=mt(),inc=sum(m,'i'),exp=sum(m,'e'),by=byCat(m),W=wal(),tot=Object.values(W).reduce((a,b)=>a+b,0);
  if(!S.tx.length)return emptyState();
  const dim=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate(),cur=ym==today().slice(0,7),el=cur?+today().slice(8):dim,ins=[];
  if(exp){const[k,v]=by[0];ins.push(`${CAT[k][0]} ${t('topc')}: <b>${nm(CAT[k])}</b> (${pc(v/exp)})`);ins.push(`📆 ${t('davg')}: <b>${fmt(exp/el)}</b>${cur?` · ${t('proj')} <b>${fmt(exp/el*dim)}</b>`:''}`)}
  if(inc)ins.push(`🌱 ${t('srate')}: <b>${pc((inc-exp)/inc)}</b>`);
  by.forEach(([k,v])=>{if(S.bud[k]&&v>S.bud[k])ins.push(`⚠️ ${nm(CAT[k])} — ${t('over')} <b>${fmt(v-S.bud[k])}</b>`)});
  return `<div class="card hero"><small>${t('bal')}</small><div class="big">${fmt(tot)}</div>
  <div class="chips"><div><small>↓ ${t('inc')}</small><b>${fmt(inc)}</b></div><div><small>↑ ${t('exp')}</small><b>${fmt(exp)}</b></div></div>
  <button class="eye" data-a="hide" aria-label="Hide">${S.hide?'🙈':'👁️'}</button></div>
  <div class="card"><div class="wl">${Object.entries(WAL).map(([k,w])=>`<div><small>${w[0]} ${nm(w)}</small><b>${fmt(W[k])}</b></div>`).join('')}</div></div>
  ${exp?`<div class="card"><h3>${t('by')}</h3><div class="two">${donut(by,exp)}<div class="lg">${by.slice(0,5).map(([k,v])=>`<div><i style="background:${CAT[k][3]}"></i>${nm(CAT[k])}<span>${pc(v/exp)}</span></div>`).join('')}</div></div></div>
  <div class="card"><h3>${t('daily')}</h3>${bars(m,dim)}</div>`:''}
  ${ins.length?`<div class="card"><h3>${t('ins')}</h3><div class="ins">${ins.map(i=>`<p>${i}</p>`).join('')}</div></div>`:''}
  <div class="card"><h3>${t('recent')}</h3>${[...m].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(row).join('')||`<small>—</small>`}</div>`},
tx(){return `<div class="card"><input id="fq" data-f="q" placeholder="${t('search')}" value="${esc(F.q)}"><div class="g2"><select data-f="type"><option value="">${t('all')}</option><option value="i" ${F.type=='i'?'selected':''}>${t('income')}</option><option value="e" ${F.type=='e'?'selected':''}>${t('expense')}</option></select><select data-f="w"><option value="">${t('wal')}: ${t('all')}</option>${opts(WAL,F.w)}</select></div></div><div id="list">${list()}</div>`},
bg(){const m=mt(),by=Object.fromEntries(byCat(m));
  return `<div class="card"><h3>${t('tb')}</h3><div class="rw"><b>${t('exp')}</b><span class="sp">${fmt(sum(m,'e'))}</span></div>${prog(sum(m,'e'),S.bud._all)}<input type="number" inputmode="numeric" data-b="_all" value="${S.bud._all||''}" placeholder="৳ ${t('set')}"></div>`+
  Object.entries(CAT).map(([k,c])=>`<div class="card"><div class="rw"><i class="ic">${c[0]}</i><b>${nm(c)}</b><span class="sp">${fmt(by[k]||0)}</span></div>${prog(by[k]||0,S.bud[k])}<input type="number" inputmode="numeric" data-b="${k}" value="${S.bud[k]||''}" placeholder="৳ ${t('set')}"></div>`).join('')},
dh(){const blk=(dir)=>{const a=S.debt.filter(d=>d.dir==dir),tot=a.reduce((s,d)=>s+d.amt-d.paid,0);
  return `<div class="dh">${t(dir)} — ${fmt(tot)}</div>`+(a.map(d=>`<div class="card" data-a="editd" data-v="${d.id}" style="cursor:pointer"><div class="rw"><b>${esc(d.who)}</b><span class="sp ${dir=='lent'?'pos':'neg'}">${fmt(d.amt-d.paid)}</span></div><div class="bar"><u style="width:${Math.min(d.paid/d.amt,1)*100}%"></u></div><small>${esc(d.note)} ${d.due?'· '+t('due')+': '+dstr(d.due,{day:'numeric',month:'short'}):''}</small></div>`).join('')||'<small style="margin:6px 4px">—</small>')};
  return blk('lent')+blk('borr')},
gl(){return S.goal.map(g=>`<div class="card"><div class="rw" data-a="editg" data-v="${g.id}" style="cursor:pointer"><i class="ic">🎯</i><b>${esc(g.name)}</b><span class="sp">${pc(g.saved/g.target)}</span></div><div class="bar"><u style="width:${Math.min(g.saved/g.target,1)*100}%"></u></div><small>${fmt(g.saved)} / ${fmt(g.target)}</small><div class="seg" style="margin:10px 0 0">${[500,1000,5000].map(n=>`<button data-a="gadd" data-v="${g.id}|${n}">+${num(n)}</button>`).join('')}</div></div>`).join('')||`<div class="card empty"><h2>🎯</h2><p>Eid fund, laptop, Hajj, flat deposit…</p></div>`},
tl(){const tot=Math.max(0,Math.round(Object.values(wal()).reduce((a,b)=>a+b,0)));
  return `<div class="card"><h3>${t('pref')}</h3><div class="seg"><button data-a="lang">${B()?'English':'বাংলা'}</button><button data-a="theme">🌓 ${S.theme}</button></div></div>
  <div class="card"><h3>🤲 ${t('zk')}</h3>${[['zc',tot],['zg',''],['zl',''],['zn','']].map(([k,v])=>`<label>${t(k)}<input id="z_${k}" type="number" inputmode="decimal" value="${v}"></label>`).join('')}<div class="zr" id="zres"></div></div>
  <div class="card"><h3>${t('data')}</h3><div class="seg"><button data-a="data">💾 ${t('data')}</button><button data-a="demo">✨ ${t('demo')}</button><button class="dng" data-a="reset">${t('reset')}</button></div></div>`}
};
const opts=(o,sel)=>Object.entries(o).map(([k,v])=>`<option value="${k}" ${k==sel?'selected':''}>${v[0]} ${nm(v)}</option>`).join('');
// Ledger list, grouped by day, honouring search/type/wallet filters
const list=()=>{const q=F.q.toLowerCase(),a=mt().filter(x=>(!F.type||x.type==F.type)&&(!F.w||x.w==F.w)&&(!q||(x.note+nm(cat(x.cat))).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));
  if(!a.length)return `<div class="empty">—</div>`;const g={};a.forEach(x=>(g[x.date]=g[x.date]||[]).push(x));
  return Object.entries(g).map(([d,xs])=>`<div class="dh">${dstr(d,{weekday:'short',day:'numeric',month:'short'})}</div><div class="card" style="margin-top:6px">${xs.map(row).join('')}</div>`).join('')};
const zk=()=>{const v=k=>+($('#z_'+k)||{}).value||0,net=v('zc')+v('zg')-v('zl'),n=v('zn');
  $('#zres').innerHTML=!n?`<small>${t('zno')}</small>`:net>=n?`<small>${t('zr')}</small>${fmt(net*.025)}`:`<small>${t('zlow')}</small>`};

/* ---------- Shell render ---------- */
const TABS=[['ov','🏠'],['tx','📒'],['bg','🎯'],['dh','🤝'],['gl','🏁'],['tl','🧰']];
function render(){
  document.documentElement.dataset.theme=S.theme;document.documentElement.lang=S.lang;
  $('#brand').innerHTML=`Taka Tracker<small>${t('tagline')}</small>`;
  $('#mn').innerHTML=['ov','tx','bg'].includes(tab)?`<button data-a="mp">‹</button><span>${dstr(ym+'-01',{month:'long',year:'numeric'})}</span><button data-a="mnx">›</button>`:'';
  $('#app').innerHTML=views[tab]();
  $('#nav').innerHTML=TABS.map(([k,i])=>`<button class="${k==tab?'on':''}" data-a="tab" data-v="${k}"><b>${i}</b>${t(k)}</button>`).join('');
  if(tab=='tl')zk();
}
const shift=n=>{const d=new Date(+ym.slice(0,4),+ym.slice(5)-1+n,1);ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,0)}`;render()};

/* ---------- Modal forms (entry, dhar, goal, backup) ---------- */
const fld=(l,h)=>`<label>${l}${h}</label>`;
function open(k,id){
  const A={tx:S.tx,debt:S.debt,goal:S.goal}[k],x=(A&&id&&A.find(y=>y.id==id))||{};ed={k,id:x.id,type:x.type||'e',dir:x.dir||'lent'};let h='';
  if(k=='tx')h=`<h2>${t('add')}</h2><div class="seg"><button data-a="ftype" data-v="e" class="${ed.type=='e'?'on':''}">${t('expense')}</button><button data-a="ftype" data-v="i" class="${ed.type=='i'?'on':''}">${t('income')}</button></div>
  ${fld(t('amt'),`<input id="f_amt" type="number" inputmode="decimal" value="${x.amt||''}">`)}<div class="g2">${fld(t('cat'),`<select id="f_cat">${opts(ed.type=='e'?CAT:INC,x.cat)}</select>`)}${fld(t('wal'),`<select id="f_w">${opts(WAL,x.w)}</select>`)}</div>
  ${fld(t('date'),`<input id="f_date" type="date" value="${x.date||today()}">`)}${fld(t('note'),`<input id="f_note" value="${esc(x.note)}">`)}`;
  if(k=='debt')h=`<h2>${t('dh')}</h2><div class="seg"><button data-a="fdir" data-v="lent" class="${ed.dir=='lent'?'on':''}">${t('lent')}</button><button data-a="fdir" data-v="borr" class="${ed.dir=='borr'?'on':''}">${t('borr')}</button></div>
  ${fld(t('who'),`<input id="f_who" value="${esc(x.who)}">`)}<div class="g2">${fld(t('amt'),`<input id="f_amt" type="number" inputmode="decimal" value="${x.amt||''}">`)}${fld(t('paid'),`<input id="f_paid" type="number" inputmode="decimal" value="${x.paid||''}">`)}</div>${fld(t('due'),`<input id="f_due" type="date" value="${x.due||''}">`)}${fld(t('note'),`<input id="f_note" value="${esc(x.note)}">`)}`;
  if(k=='goal')h=`<h2>${t('gl')}</h2>${fld(t('name'),`<input id="f_name" value="${esc(x.name)}">`)}<div class="g2">${fld(t('target'),`<input id="f_amt" type="number" inputmode="decimal" value="${x.target||''}">`)}${fld(t('saved'),`<input id="f_paid" type="number" inputmode="decimal" value="${x.saved||''}">`)}</div>`;
  if(k=='data')h=`<h2>${t('data')}</h2><textarea id="f_json" rows="8" style="font:12px monospace">${esc(JSON.stringify(S))}</textarea><div class="seg"><button data-a="dlj">⬇ JSON</button><button data-a="dlc">⬇ CSV</button><button data-a="restore">${t('restore')}</button></div>`;
  h+=`<div class="seg">${k!='data'?`<button class="btn p" data-a="save">${t('save')}</button>`:''}${x.id?`<button class="dng" data-a="del">${t('del')}</button>`:''}<button data-a="close">✕</button></div>`;
  $('#sheet').innerHTML=h;$('#modal').classList.add('on');
}
const upsert=(a,o)=>{const i=a.findIndex(y=>y.id==o.id);i<0?a.push(o):a[i]=o};
const dl=(n,s,ty)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:ty}));a.download=n;a.click()};
const g=i=>($('#f_'+i)||{}).value||'';

/* ---------- Demo data: a believable Dhaka month ---------- */
function demo(){
  const mx=ym==today().slice(0,7)?+today().slice(8):28,add=(type,c,w,d,amt,note)=>S.tx.push({id:uid(),type,cat:c,w,amt,date:`${ym}-${String(Math.min(d,mx)).padStart(2,0)}`,note});
  add('i','salary','bank',1,52000,'Monthly salary');add('i','free','bkash',Math.min(9,mx),8500,'Freelance payment');add('e','rent','bank',2,14000,'House rent');add('e','bill','bkash',5,1850,'DESCO + Titas bill');add('e','net','bkash',6,799,'Broadband');add('e','fam','bkash',3,6000,'Sent home to Ammu');
  const P=[['bazar','Chal-dal-tel',300,1800,'cash'],['bazar','Sabji & fish',250,900,'cash'],['food','Fuchka & cha',60,250,'cash'],['food','Lunch — office',120,300,'bkash'],['trans','Rickshaw',40,150,'cash'],['trans','Pathao ride',120,380,'bkash'],['med','Pharmacy',150,900,'cash'],['shop','Online order',500,3200,'card'],['fun','Cinema & snacks',500,1400,'nagad'],['net','Mobile recharge',100,500,'bkash']];
  for(let i=0;i<30;i++){const p=P[Math.floor(Math.random()*P.length)];add('e',p[0],p[4],1+Math.floor(Math.random()*mx),p[2]+Math.floor(Math.random()*(p[3]-p[2])),p[1])}
  S.bud={_all:38000,bazar:8000,food:4000,trans:3500,fun:2000};
  if(!S.debt.length)S.debt.push({id:uid(),dir:'lent',who:'Rafi (friend)',amt:5000,paid:2000,due:'',note:'Emergency'},{id:uid(),dir:'borr',who:'Mejo Mama',amt:10000,paid:0,due:'',note:'Laptop'});
  if(!S.goal.length)S.goal.push({id:uid(),name:'Eid fund',target:30000,saved:11500});
  persist();tab='ov';render();
}

/* ---------- Actions (event delegation) ---------- */
const act={
  tab:v=>{tab=v;render();scrollTo(0,0)},mp:()=>shift(-1),mnx:()=>shift(1),
  add:()=>open(tab=='dh'?'debt':tab=='gl'?'goal':'tx'),edit:v=>open('tx',v),editd:v=>open('debt',v),editg:v=>open('goal',v),
  close:()=>$('#modal').classList.remove('on'),
  ftype:(v,b)=>{ed.type=v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));$('#f_cat').innerHTML=opts(v=='e'?CAT:INC)},
  fdir:(v,b)=>{ed.dir=v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))},
  save(){
    const amt=+g('amt');if(!(amt>0))return $('#f_amt').focus();const id=ed.id||uid();
    if(ed.k=='tx'){const o={id,type:ed.type,amt,cat:g('cat'),w:g('w'),date:g('date')||today(),note:g('note').trim()};upsert(S.tx,o);ym=o.date.slice(0,7)}
    if(ed.k=='debt'){if(!g('who').trim())return $('#f_who').focus();upsert(S.debt,{id,dir:ed.dir,who:g('who').trim(),amt,paid:Math.min(+g('paid')||0,amt),due:g('due'),note:g('note').trim()})}
    if(ed.k=='goal'){if(!g('name').trim())return $('#f_name').focus();upsert(S.goal,{id,name:g('name').trim(),target:amt,saved:+g('paid')||0})}
    persist();act.close();render()},
  del(v,b){if(!b.dataset.s){b.dataset.s=1;b.textContent=t('sure');return}
    const k={tx:'tx',debt:'debt',goal:'goal'}[ed.k];S[k]=S[k].filter(y=>y.id!=ed.id);persist();act.close();render()},
  gadd:v=>{const[id,n]=v.split('|'),x=S.goal.find(y=>y.id==id);x.saved+=+n;persist();render()},
  hide:()=>{S.hide^=1;persist();render()},lang:()=>{S.lang=B()?'en':'bn';persist();render()},
  theme:()=>{S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme];persist();render()},
  demo,data:()=>open('data'),
  dlj:()=>dl('taka-tracker-backup.json',JSON.stringify(S),'application/json'),
  dlc:()=>dl('taka-tracker.csv','date,type,category,wallet,amount,note\n'+S.tx.map(x=>[x.date,x.type=='i'?'income':'expense',x.cat,x.w,x.amt,'"'+(x.note||'').replace(/"/g,'""')+'"'].join(',')).join('\n'),'text/csv'),
  restore(){try{const o=JSON.parse(g('json'));if(!Array.isArray(o.tx))throw 0;S=Object.assign(S,o);persist();act.close();render()}catch{$('#f_json').style.outline='2px solid var(--r)'}},
  reset(v,b){if(!b.dataset.s){b.dataset.s=1;b.textContent=t('sure');return}S={tx:[],bud:{},debt:[],goal:[],lang:S.lang,theme:S.theme,hide:0};persist();render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act[b.dataset.a](b.dataset.v,b);else if(e.target.id=='modal')act.close()});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.f=='q'){F.q=el.value;$('#list').innerHTML=list()}
  if((el.id||'').startsWith('z_'))zk()});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.f&&el.dataset.f!='q'){F[el.dataset.f]=el.value;$('#list').innerHTML=list()}
  if(el.dataset.b){const v=+el.value;v>0?S.bud[el.dataset.b]=v:delete S.bud[el.dataset.b];persist();render()}});
render();
</script></body></html>
